name: Bug report
description: Report a reproducible issue using sanitized evidence
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
      description: Do not attach sensitive screenshots or OCR text.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows version, app version, monitor resolution and scaling
