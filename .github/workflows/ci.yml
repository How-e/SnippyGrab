name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Milestone evidence checks resolve historical implementation commits.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.400'
      - run: ./scripts/provision-ocr.ps1
        shell: pwsh
      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore -c Release -warnaserror
      - run: dotnet test --no-build -c Release --logger trx
      - run: dotnet format --no-restore --verify-no-changes
      - name: Isolated installer, upgrade and packaging boundary fixtures
        shell: pwsh
        run: |
          ./scripts/test-native-ocr-policy.ps1
          ./scripts/test-release-gates.ps1
          ./scripts/test-resource-review.ps1
          ./scripts/test-signing.ps1
          ./scripts/test-installer.ps1
          ./scripts/test-install-files.ps1
          ./scripts/test-artifact-retention.ps1
          ./scripts/test-milestone-map.ps1 -SelfTest
          ./scripts/test-native-probe.ps1 -Check reliability
          ./scripts/measure-startup.ps1 -Samples 2
          ./scripts/audit-dependencies.ps1 -SelfTest
      - run: ./scripts/audit-dependencies.ps1
        shell: pwsh
