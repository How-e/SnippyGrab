name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.400'
      - run: ./scripts/provision-ocr.ps1
        shell: pwsh
      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore -c Release -warnaserror
      - run: dotnet test --no-build -c Release
      - name: Isolated release boundary fixtures
        shell: pwsh
        run: |
          ./scripts/test-native-ocr-policy.ps1
          ./scripts/test-release-gates.ps1
          ./scripts/test-signing.ps1
          ./scripts/test-installer.ps1
          ./scripts/test-install-files.ps1
          ./scripts/test-artifact-retention.ps1
          ./scripts/audit-dependencies.ps1 -SelfTest
      - run: ./scripts/audit-dependencies.ps1
        shell: pwsh
      - name: Package unsigned portable and per-user installer
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          ./scripts/package.ps1 -Version $version -RequireTag
          ./scripts/verify-package.ps1 -Bundle "artifacts/SnippyGrab-$version-win-x64" -Installer "artifacts/SnippyGrab-$version-Setup.exe"
      # Add protected external signing BEFORE generating final checksums.
      # Never expose signing credentials to pull-request builds.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $bundle = "artifacts/SnippyGrab-$version-win-x64.zip"
          $prerelease = if ($version.Contains('-')) { @('--prerelease') } else { @() }
          $installer = "artifacts/SnippyGrab-$version-Setup.exe"
          gh release create $env:GITHUB_REF_NAME $bundle "$bundle.sha256" $installer "$installer.sha256" --verify-tag --notes-file CHANGELOG.md @prerelease
